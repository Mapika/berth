version: 2
updates:
  # Pin actions by SHA; Dependabot resolves the latest SHA per tag each week.
  # Updates are batched into at most two PRs per ecosystem: minor + patch bumps
  # in one group, and all major bumps together in a second group so breaking
  # changes are reviewed apart from the safe ones.
  #
  # Python deps are intentionally NOT managed here. Dependabot can't read
  # uv.lock, so it can neither group nor lock pip updates — it opens one red PR
  # per dependency every run. .github/workflows/uv-upgrade.yml runs
  # `uv lock --upgrade` weekly and opens a single validated PR instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ui-major:
        patterns: ["*"]
        update-types: ["major"]
