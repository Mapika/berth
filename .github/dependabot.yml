version: 2
updates:
  # Pin actions by SHA; Dependabot resolves the latest SHA per tag each week.
  # Updates are batched into at most two PRs per ecosystem: minor + patch bumps
  # in one group, and all major bumps together in a second group so breaking
  # changes are reviewed apart from the safe ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ui-major:
        patterns: ["*"]
        update-types: ["major"]
