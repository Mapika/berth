name: uv upgrade

# Weekly refresh of Python dependencies. Dependabot can't read uv.lock, so it
# can neither group nor lock pip updates — it opens one (red) PR per dependency
# every run. Instead this job runs `uv lock --upgrade` and opens a SINGLE PR
# with every Python update and the regenerated lockfile, validated the same way
# CI validates a normal change.
#
# Note: this refreshes the locked versions in uv.lock; it does not raise the
# `>=` floors in pyproject.toml (those are deliberate minimums you bump by hand
# when you start depending on a newer release).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: uv lock --upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Upgrade lockfile
        run: uv lock --upgrade

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No lockfile changes; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Validate the upgraded set exactly as CI does, so the PR is known-good:
      # PRs opened with GITHUB_TOKEN do not trigger the CI workflow.
      - name: Validate
        if: steps.diff.outputs.changed == 'true'
        run: |
          uv sync --frozen --extra dev
          uv run --frozen ruff check src tests
          uv run --frozen mypy src
          uv run --frozen pytest tests/unit tests/integration -q

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: deps/uv-upgrade
          delete-branch: true
          commit-message: "chore(deps): uv lock --upgrade"
          title: "chore(deps): weekly uv lock --upgrade"
          body: |
            Automated weekly Python dependency refresh.

            `uv lock --upgrade` regenerated `uv.lock`. The upgraded set was
            validated in-job with `ruff`, `mypy`, and
            `pytest tests/unit tests/integration` before this PR was opened.

            Dependabot can't manage `uv.lock`, so Python deps are refreshed here
            rather than one-per-dependency. Re-runs update this same PR instead
            of opening new ones.
